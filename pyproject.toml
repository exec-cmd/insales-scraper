[project]
name = "insales-scraper"
version = "1.1.0"
description = "General scraper for websites based on insales"
readme = "README.md"
authors = [
    { name = "cmd.exe" }
]
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.0",
    "httpx>=0.28.1",
    "polars>=1.43.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
inscrap = "insales_scraper.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
